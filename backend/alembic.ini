[alembic]
# Migrations live alongside the models they migrate (infrastructure/db/postgres),
# not at the repo root, so the Postgres backend's schema history is self-contained.
script_location = app/infrastructure/db/postgres/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally left unset here: `migrations/env.py` builds it
# at runtime from `app.core.settings.Settings` (bootstrap env vars / .env
# defaults), per .claude/rules/config-management.md — this file must never
# hold a real connection string/secret.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
