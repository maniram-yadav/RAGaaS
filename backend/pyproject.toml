[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI's `Depends(...)`/`Query(...)` in a parameter default is the
# framework's own idiom, not the mutable-default-argument bug B008 exists to
# catch (STORY-006, first FastAPI router in the app) — ruff's own bugbear
# docs recommend this allowlist for FastAPI projects rather than disabling
# B008 outright.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
